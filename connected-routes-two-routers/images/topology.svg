<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Arial, sans-serif" font-size="13">
<rect width="800" height="260" fill="#ffffff"/>
<text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Two sites, one /30 link: connected routes only</text>
<g stroke="#374151" stroke-width="2">
<line x1="310" y1="120" x2="490" y2="120"/>
<line x1="60" y1="120" x2="130" y2="120"/>
<line x1="670" y1="120" x2="740" y2="120"/>
</g>
<g fill="#dcfce7" stroke="#15803d" stroke-width="2">
<rect x="130" y="85" width="180" height="70" rx="8"/>
<rect x="490" y="85" width="180" height="70" rx="8"/>
</g>
<g text-anchor="middle" fill="#111827">
<text x="220" y="125" font-weight="bold">Cafe-RT1</text>
<text x="580" y="125" font-weight="bold">Fallout-RT1</text>
<text x="400" y="108" fill="#1d4ed8">192.168.2.0/30</text>
<text x="80" y="168" fill="#4b5563">Coffee House LAN</text>
<text x="80" y="186" fill="#4b5563">192.168.1.0/24</text>
<text x="720" y="168" fill="#4b5563">Shelter LAN</text>
<text x="720" y="186" fill="#4b5563">192.168.3.0/24</text>
<text x="400" y="215" fill="#4b5563">Each router knows only its own LAN and the shared link.</text>
<text x="400" y="237" fill="#4b5563">LAN-to-LAN reachability needs static or dynamic routes (next lesson).</text>
</g>
<g font-size="12" fill="#374151">
<text x="316" y="138">Et0/1 .1</text>
<text x="436" y="138">Et0/1 .2</text>
<text x="70" y="138">Et0/0 .1</text>
<text x="676" y="138">Et0/0 .1</text>
</g>
</svg>
